# Private candidate executor ingress. It does not serve public pages or admin APIs.
server {
    listen 443 ssl;
    server_name 192.168.5.6;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s;

    location /api/capability-worker/ {
        set $candidate_api http://stl-intelligence-demo-api:8000;
        proxy_pass $candidate_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location / { return 404; }
}
