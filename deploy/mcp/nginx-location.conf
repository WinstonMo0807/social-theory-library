# Insert into the existing public server. The dedicated limit zones are added
# by the deployment script; no existing API limit or proxy route is changed.
location = /mcp {
    limit_req zone=stl_mcp_api burst=20 nodelay;
    limit_req_status 429;
    limit_conn stl_mcp_connections 4;
    client_max_body_size 2m;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-Proto $library_forwarded_proto;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $stl_mcp_upstream http://stl-mcp:18982;
    proxy_pass $stl_mcp_upstream;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /mcp/ {
    return 404;
}
